<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lund Films — v7</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#0d0d0d;--fg:#f1efe9;--yellow:#f5d000;--muted:#7c7a72;--line:#242421;}
    body{background:var(--bg);color:var(--fg);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:inherit;text-decoration:none;}
    .split{display:grid;grid-template-columns:42% 58%;min-height:100vh;}
    /* LEFT — fixed identity panel */
    .left{position:sticky;top:0;height:100vh;background:var(--yellow);color:#0d0d0d;padding:30px;display:flex;flex-direction:column;justify-content:space-between;}
    .left .top{display:flex;justify-content:space-between;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
    .left h1{font-family:'Archivo Black',sans-serif;font-size:clamp(3rem,7.5vw,8.5rem);line-height:.82;letter-spacing:-.03em;text-transform:uppercase;}
    .left .bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.8;}
    .left .bottom a{border-bottom:2px solid transparent;transition:border-color .15s;}
    .left .bottom a:hover{border-color:#0d0d0d;}
    /* RIGHT — scrolling work */
    .right{padding:30px 34px 60px;}
    .right .lbl{font-size:.68rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding-bottom:14px;border-bottom:1px solid var(--line);}
    .proj{display:block;padding:34px 0;border-bottom:1px solid var(--line);transition:padding-left .22s;}
    .proj:hover{padding-left:18px;}
    .proj .frame{aspect-ratio:16/9;margin-bottom:18px;overflow:hidden;position:relative;}
    .proj .frame .ph{position:absolute;inset:0;transition:transform .5s;}
    .proj:nth-of-type(1) .ph{background:linear-gradient(135deg,#8a5a1e,#191007);}
    .proj:nth-of-type(2) .ph{background:linear-gradient(135deg,#1e4a6a,#070e14);}
    .proj:nth-of-type(3) .ph{background:linear-gradient(135deg,#6a1e2e,#120609);}
    .proj:nth-of-type(4) .ph{background:linear-gradient(135deg,#2e5a2e,#06100 6);}
    .proj:nth-of-type(5) .ph{background:linear-gradient(135deg,#52306a,#0c0712);}
    .proj:hover .ph{transform:scale(1.05);}
    .proj .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(13,13,13,.55);border:1px solid rgba(241,239,233,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;}
    .proj:hover .play{opacity:1;}
    .proj .play svg{width:18px;height:18px;fill:var(--fg);margin-left:3px;}
    .proj .row{display:flex;justify-content:space-between;align-items:baseline;}
    .proj .name{font-family:'Archivo Black',sans-serif;font-size:clamp(1.4rem,2.6vw,2.2rem);text-transform:uppercase;letter-spacing:-.01em;}
    .proj .meta{font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
    .proj:hover .meta{color:var(--yellow);}
    footer{padding:50px 34px;display:flex;justify-content:space-between;align-items:center;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
    footer a:hover{color:var(--yellow);}
    @media(max-width:800px){
      .split{grid-template-columns:1fr;}
      .left{position:relative;height:auto;min-height:62vh;gap:30px;}
    }
  </style>
</head>
<body>
  <div class="split">
    <div class="left">
      <div class="top"><span>Algot Lund</span><span>Helsinki, FI</span></div>
      <h1>Lund<br>Films</h1>
      <div class="bottom">
        <div>Cinematographer<br>&amp; Editor</div>
        <div style="text-align:right">
          <a href="mailto:hello@lund.films">Mail</a><br>
          <a href="https://instagram.com/lund.films">Instagram ↗</a>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="lbl">Selected Work — 2023→25</div>

      <a class="proj" href="#">
        <div class="frame"><div class="ph"></div><div class="play"><svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg></div></div>
        <div class="row"><span class="name">Stinging Rocko</span><span class="meta">Video · 2025</span></div>
      </a>
      <a class="proj" href="#">
        <div class="frame"><div class="ph"></div><div class="play"><svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg></div></div>
        <div class="row"><span class="name">SP Cables</span><span class="meta">3D Render · 2025</span></div>
      </a>
      <a class="proj" href="#">
        <div class="frame"><div class="ph"></div><div class="play"><svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg></div></div>
        <div class="row"><span class="name">Joel Sundkvist</span><span class="meta">Promo Photos · 2024</span></div>
      </a>
      <a class="proj" href="#">
        <div class="frame"><div class="ph"></div><div class="play"><svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg></div></div>
        <div class="row"><span class="name">Heal From You</span><span class="meta">Album Cover · 2024</span></div>
      </a>
      <a class="proj" href="#">
        <div class="frame"><div class="ph"></div><div class="play"><svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg></div></div>
        <div class="row"><span class="name">8th Road Home</span><span class="meta">Album Cover · 2024</span></div>
      </a>
      <footer>
        <span>© 2026 Lund Films</span>
        <a href="mailto:hello@lund.films">hello@lund.films</a>
      </footer>
    </div>
  </div>
</body>
</html>
