<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52">
  <!-- P / förstoringsglas-ikon -->
  <g transform="translate(2, 2)">
    <!-- Cirkel (förstoringsglaset) -->
    <circle cx="24" cy="18" r="14" fill="none" stroke="#ffbf32" stroke-width="6"/>
    <!-- Skaft -->
    <line x1="13.5" y1="29.5" x2="6" y2="42" stroke="#ffbf32" stroke-width="6" stroke-linecap="round"/>
    <!-- Reflexbåge inuti cirkeln -->
    <path d="M 16 10 Q 20 7 26 9" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Text: PLUND -->
  <text x="58" y="26"
    font-family="DM Sans, Arial, sans-serif"
    font-weight="800"
    font-size="22"
    fill="white"
    letter-spacing="-0.5">PLUND</text>

  <!-- Text: MEDIA -->
  <text x="59" y="44"
    font-family="DM Sans, Arial, sans-serif"
    font-weight="400"
    font-size="13"
