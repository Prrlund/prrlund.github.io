<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Här fanns ingenting — Plund</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/plund-ikon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#070707" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,400;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:   #070707;
      --text: #f2f1ee;
      --dim:  #8a8884;
      --guld: #ffbf32;
      --kant: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px clamp(20px, 4vw, 48px);
    }
    .logo-svg { height: 44px; width: auto; display: block; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px clamp(20px, 6vw, 110px) clamp(60px, 10vh, 120px);
      max-width: 900px;
    }
    .etikett {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: .72rem; font-weight: 700; letter-spacing: .22em;
      text-transform: uppercase; color: var(--guld); margin-bottom: 26px;
    }
    .etikett::before {
      content: ''; width: 34px; height: 1px; background: var(--guld); display: block;
    }
    h1 {
      font-size: clamp(2.4rem, 7vw, 5rem);
      font-weight: 800; letter-spacing: -.045em; line-height: .98;
      margin-bottom: 26px;
    }
    p {
      color: var(--dim);
      font-size: clamp(1rem, 1.4vw, 1.1rem);
      line-height: 1.8;
      max-width: 520px;
      margin-bottom: 42px;
    }
    .knapp {
      display: inline-block;
      background: var(--guld); color: #0a0a0a;
      padding: 17px 38px; border-radius: 100px;
      font-size: .92rem; font-weight: 700; text-decoration: none;
      align-self: flex-start;
      transition: transform .2s, box-shadow .2s;
    }
    .knapp:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,191,50,.25); }
    footer {
      border-top: 1px solid var(--kant);
      padding: 22px clamp(20px, 6vw, 110px);
      font-size: .78rem; color: var(--dim); opacity: .6;
    }
  </style>
</head>
<body>

<header>
  <a href="/" aria-label="Plund">
    <img src="/plund-namn.svg" alt="Plund" class="logo-svg" />
  </a>
</header>

<main>
  <p class="etikett">404</p>
  <h1>Här fanns ingenting.</h1>
  <p>
    Vilket är ungefär vad jag visste om de flesta av företagen jag filmat, innan jag kom dit.
  </p>
  <a href="/" class="knapp">Tillbaka →</a>
</main>

<footer>© 2026 Plund Media</footer>

</body>
</html>
